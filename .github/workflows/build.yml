name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build & package Windows
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-convert-windows
          path: release/*.exe
          retention-days: 30

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build & package macOS
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-convert-mac
          path: release/*.dmg
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build & package Linux
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-convert-linux
          path: release/*.AppImage
          retention-days: 30

  release:
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Skill Convert ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/skill-convert-windows/*.exe
            artifacts/skill-convert-mac/*.dmg
            artifacts/skill-convert-linux/*.AppImage
          body: |
            ## Skill Convert ${{ github.ref_name }}

            GUI wrapper for skill-convert — convert AI agent skills between Claude / Codex / Copilot / Universal formats.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows  | `skill-convert-setup-*.exe` |
            | macOS    | `skill-convert-*.dmg` |
            | Linux    | `skill-convert-*.AppImage` |

            ### Installation
            - **Windows:** Download the `.exe` installer, double-click, follow setup wizard
            - **macOS:** Download `.dmg`, drag to Applications
            - **Linux:** `chmod +x skill-convert-*.AppImage && ./skill-convert-*.AppImage`

            > ⚠️ Windows Defender may warn about unrecognized app (unsigned). Click **More info** → **Run anyway**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
